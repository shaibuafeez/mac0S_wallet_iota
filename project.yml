name: IOTAWallet
options:
  bundleIdPrefix: com.iota
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.30"

packages:
  IotaSDK:
    path: ../iota-rust-sdk/bindings/swift

targets:
  IOTAWallet:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iota.wallet
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Sources/Info.plist
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../iota-rust-sdk/bindings/swift/Sources/IotaSDKFFI"
        OTHER_LDFLAGS: "$(inherited) -liota_sdk_ffi"
    dependencies:
      - package: IotaSDK
